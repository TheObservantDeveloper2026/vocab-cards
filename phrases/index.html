<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>英语词组卡 | Vocabulary Cards</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --green: #22a06b;
    --red: #e5484d;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1c2333;
    --text-sub: #6b7280;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(28, 35, 51, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f8fc 55%, #eef4f2 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 14px 16px 8px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  h1 small { color: var(--text-sub); font-weight: 500; font-size: 12px; margin-left: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  select, .btn-ghost {
    appearance: none;
    border: 1px solid #dfe3ee;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select { min-width: 130px; }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost.active { border-color: var(--red); color: var(--red); background: #fef0f0; }
  .badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 5px;
    background: var(--red);
    color: #fff;
    border-radius: 999px;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }
  .stats { margin-left: auto; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .stats b { color: var(--green); }
  .stats b.red { color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 8px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-wrap { width: 100%; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e4e8f4; border-radius: 3px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c9bff); border-radius: 3px; transition: width .25s; }
  .progress-num { font-size: 12px; color: var(--text-sub); white-space: nowrap; }

  .scene { perspective: 1400px; width: 100%; max-width: 560px; }
  .card {
    position: relative;
    width: 100%;
    height: 340px;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #c5cbe0 transparent;
  }
  .face::-webkit-scrollbar { width: 6px; }
  .face::-webkit-scrollbar-thumb { background: #c5cbe0; border-radius: 3px; }
  .face::-webkit-scrollbar-track { background: transparent; }
  .face-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
    width: 100%;
    min-height: 100%;
    box-sizing: border-box;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(150deg, #ffffff, #f6f8ff); }
  .word {
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700;
    word-break: break-word;
    line-height: 1.2;
  }
  .word.zh { font-size: clamp(26px, 6vw, 42px); color: var(--primary-dark); font-weight: 600; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-sub); }
  .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    color: var(--text-sub);
    background: #eef1fb;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .known-dot {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #e8f7f0;
    color: var(--green);
  }
  .wrong-dot {
    position: absolute;
    top: 40px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #fdebec;
    color: var(--red);
  }
  .pos { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: #b6bccb; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, filter .15s;
  }
  .actions button:active { transform: scale(.97); }
  #btnUnknown { background: var(--red); }
  #btnKnown { background: var(--green); }
  #btnFlip { background: var(--primary); width: 100%; max-width: 560px; flex: none; }
  .actions button[disabled] { opacity: .45; cursor: default; }

  .done-panel { text-align: center; max-width: 480px; }
  .done-panel h2 { font-size: 26px; margin-bottom: 10px; }
  .done-panel p { color: var(--text-sub); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .done-panel button {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #btnAgainUnknown { background: var(--primary); }
  #btnRestart { background: #8a93a8; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c4;
    padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
  }
  kbd {
    background:#fff;border:1px solid #dfe3ee;border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;font-size:11px;color:#5b6272;
  }
  @media (max-width: 480px) {
    .card { height: 280px; }
    .face-inner { padding: 22px 18px; }
    .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>英语词组卡 <small>点击卡片 · 看词组想中文</small></h1>
  <div class="toolbar">
    <select id="groupSel"></select>
    <button class="btn-ghost" id="btnShuffle">洗牌</button>
    <button class="btn-ghost" id="btnWrongBook">错题本<span class="badge" id="wrongBadge">0</span></button>
    <button class="btn-ghost" id="btnReset">清空进度</button>
    <span class="stats" id="statsLine"></span>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progressFill"></i></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
  </div>

  <div class="scene" id="study">
    <div class="card" id="card">
      <div class="face front">
        <div class="face-inner">
          <span class="tag" id="tagFront"></span>
          <span class="known-dot" id="knownDot" hidden>已掌握</span>
          <span class="wrong-dot" id="wrongDot" hidden>错题</span>
          <div class="word" id="wordFront"></div>
          <div class="hint">想一想中文意思，点击卡片查看</div>
          <span class="pos" id="posFront"></span>
        </div>
      </div>
      <div class="face back">
        <div class="face-inner">
          <span class="tag" id="tagBack"></span>
          <div class="word zh" id="wordBack"></div>
          <div class="hint" id="enBack"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="done-panel" id="done" hidden>
    <h2 id="doneTitle">本组完成 🎉</h2>
    <p id="doneText"></p>
    <button id="btnAgainUnknown">只复习未掌握的卡片</button>
    <button id="btnRestart">重新开始本组</button>
  </div>

  <div class="actions" id="actions">
    <button id="btnFlip">翻转卡片（空格）</button>
    <button id="btnUnknown" hidden>不认识 ←</button>
    <button id="btnKnown" hidden>认识 →</button>
  </div>
</main>

<footer>答错自动收录错题本 · 在错题本答对后消除 · 数据保存在本地浏览器</footer>

":"Part 07"},{"en":"for any sake","zh":"无论如何；千万","group":"Part 07"},{"en":"without sake","zh":"无缘无故；毫无理由","group":"Part 07"},{"en":"in sequence","zh":"依次；按顺序","group":"Part 07"},{"en":"a sequence of","zh":"一系列；一连串","group":"Part 07"},{"en":"in sequence of","zh":"按...的顺序","group":"Part 07"},{"en":"steer clear of","zh":"避开；绕开","group":"Part 07"},{"en":"steer a course","zh":"驾驶船只；确定路线","group":"Part 07"},{"en":"have a stroke","zh":"中风","group":"Part 07"},{"en":"at a/one stroke","zh":"一举；一下子","group":"Part 07"},{"en":"fling oneself into","zh":"投身于；扑倒在","group":"Part 07"},{"en":"fling out","zh":"冲出；愤然离开；抛出","group":"Part 07"},{"en":"have a fling","zh":"尽情放纵；尝试","group":"Part 07"},{"en":"in restraint of","zh":"为了抑制/约束...","group":"Part 07"},{"en":"with restraint","zh":"有节制地；克制地","group":"Part 08"},{"en":"without restraint","zh":"无拘无束地；毫无节制地","group":"Part 08"},{"en":"rival sb.","zh":"与某人竞争；与某人匹敌","group":"Part 08"},{"en":"without a rival","zh":"无可匹敌；无敌","group":"Part 08"},{"en":"a succession of","zh":"一连串的；一系列的","group":"Part 08"},{"en":"in succession","zh":"接连地；连续地","group":"Part 08"},{"en":"suck knowledge into one's mind","zh":"吸收知识","group":"Part 08"},{"en":"suck up","zh":"吸收；奉承；拍马屁","group":"Part 08"},{"en":"surplus population","zh":"过剩人口","group":"Part 08"},{"en":"surplus value","zh":"剩余价值","group":"Part 08"},{"en":"in view of","zh":"鉴于；考虑到","group":"Part 08"},{"en":"with a view to doing sth.","zh":"为了做某事；以...为目的","group":"Part 08"},{"en":"view...as","zh":"把...看作...","group":"Part 08"},{"en":"an abundance of...","zh":"大量的...；丰富的...","group":"Part 08"},{"en":"bias against","zh":"对...的偏见","group":"Part 08"},{"en":"bias toward","zh":"对...的偏向/偏爱","group":"Part 08"},{"en":"in a blaze","zh":"熊熊燃烧；闪耀","group":"Part 08"},{"en":"blaze a trail","zh":"开辟道路；带头","group":"Part 08"},{"en":"take a bribe","zh":"受贿","group":"Part 08"},{"en":"offer a bribe","zh":"行贿","group":"Part 08"},{"en":"in bud","zh":"发芽；含苞待放","group":"Part 08"},{"en":"government bulletin","zh":"政府公报","group":"Part 08"},{"en":"news bulletin","zh":"新闻简报","group":"Part 08"},{"en":"trade bulletin","zh":"贸易公报","group":"Part 08"},{"en":"carve...out of/from","zh":"从...中开辟出；用...雕刻出","group":"Part 08"},{"en":"carve...into","zh":"把...雕刻成","group":"Part 08"},{"en":"rope in","zh":"说服...参加；用绳围起","group":"Part 08"},{"en":"be on the ropes","zh":"濒临失败；处于困境","group":"Part 08"},{"en":"be at the end of (one's) rope","zh":"智穷力竭；山穷水尽","group":"Part 08"},{"en":"in abundance","zh":"大量地；充裕地","group":"Part 08"},{"en":"take caution against","zh":"提防；警惕","group":"Part 08"},{"en":"with caution","zh":"谨慎地；小心地","group":"Part 08"},{"en":"caution sb. against doing sth.","zh":"警告某人不要做某事","group":"Part 08"},{"en":"clasp hands","zh":"紧紧握手","group":"Part 08"},{"en":"clasp one's hands","zh":"双手合十；紧握双手","group":"Part 08"},{"en":"come to/reach the climax","zh":"达到高潮","group":"Part 08"},{"en":"at the climax of","zh":"处于...的高潮","group":"Part 08"},{"en":"confer sth. on sb.","zh":"授予某人某物（荣誉、学位等）","group":"Part 08"},{"en":"confer with sb. on/about sth.","zh":"与某人商议某事","group":"Part 08"},{"en":"cold closet","zh":"冷藏柜；冷气橱","group":"Part 08"},{"en":"water closet","zh":"厕所；抽水马桶","group":"Part 08"},{"en":"engine clutch","zh":"发动机离合器","group":"Part 08"},{"en":"in sb.'s clutches","zh":"在某人掌控之中","group":"Part 08"},{"en":"clutch at sth.","zh":"试图抓住某物","group":"Part 08"},{"en":"be detached from","zh":"与...分离；超脱于","group":"Part 08"},{"en":"be attached to","zh":"附属于；喜爱；依恋","group":"Part 08"},{"en":"differentiate...from...","zh":"区分...与...","group":"Part 08"},{"en":"differentiate between...and...","zh":"区分...与...","group":"Part 08"},{"en":"stand on one's dignity","zh":"保持尊严；要求受到尊重","group":"Part 08"},{"en":"beneath one's dignity","zh":"有失身份；有损尊严","group":"Part 08"},{"en":"discriminate against","zh":"歧视；排斥","group":"Part 08"},{"en":"discriminate between...and...","zh":"区分...与...","group":"Part 08"},{"en":"discriminate...from...","zh":"把...与...区别开","group":"Part 08"},{"en":"make a mock of sb.","zh":"嘲弄某人；模仿取笑","group":"Part 08"},{"en":"mock up","zh":"制作模型；仿制","group":"Part 08"},{"en":"monopoly bureau","zh":"专卖局","group":"Part 08"},{"en":"monopoly right","zh":"专卖权；垄断权","group":"Part 08"},{"en":"monopoly of sales","zh":"销售垄断","group":"Part 08"},{"en":"in mortgage","zh":"在抵押中","group":"Part 08"},{"en":"send by dispatch","zh":"快件发送；发送急件","group":"Part 08"},{"en":"with dispatch","zh":"迅速；尽快","group":"Part 08"},{"en":"take drastic measures","zh":"采取果断措施；采取激烈手段","group":"Part 08"},{"en":"a drastic debate","zh":"激烈的辩论","group":"Part 08"},{"en":"make drastic change","zh":"做出重大改变","group":"Part 08"},{"en":"escort sb. back","zh":"护送某人返回","group":"Part 08"},{"en":"under escort","zh":"在护送下；在押送下","group":"Part 08"},{"en":"live in exile","zh":"流亡生活","group":"Part 08"},{"en":"exile sb. to sth.","zh":"把某人流放到某地","group":"Part 08"},{"en":"flare out","zh":"突然发怒；闪耀","group":"Part 08"},{"en":"flare up","zh":"突然爆发；加剧；突然发怒","group":"Part 08"},{"en":"flatter sb. on/about sth.","zh":"就某事奉承某人","group":"Part 08"},{"en":"flatter oneself","zh":"自鸣得意；自以为是","group":"Part 08"},{"en":"a batch of","zh":"一批；一炉","group":"Part 08"},{"en":"batch production","zh":"批量生产","group":"Part 08"},{"en":"fall into a flutter","zh":"心慌意乱；忐忑不安","group":"Part 08"},{"en":"in a flutter","zh":"忐忑不安；激动","group":"Part 08"},{"en":"foster father/mother","zh":"养父/养母","group":"Part 08"},{"en":"foster son/daughter","zh":"养子/养女","group":"Part 08"},{"en":"gasp at","zh":"对...感到惊讶/震惊","group":"Part 08"},{"en":"incorporate...with","zh":"把...与...合并","group":"Part 08"},{"en":"incorporate...in/into","zh":"把...并入/纳入...","group":"Part 08"},{"en":"inject...into sb.","zh":"给某人注射...；向某人灌输...","group":"Part 08"},{"en":"inject sb. with","zh":"给某人注射...","group":"Part 08"},{"en":"contend for","zh":"争夺；争取","group":"Part 08"},{"en":"contend with","zh":"对付；与...竞争/搏斗","group":"Part 08"},{"en":"couch potato","zh":"沙发土豆；成天看电视的人","group":"Part 08"},{"en":"couch sth. (in sth.)","zh":"用...表达；隐含","group":"Part 08"},{"en":"from the cradle to the grave","zh":"从生到死；一辈子","group":"Part 08"},{"en":"in the cradle","zh":"在摇篮里；在幼年时期","group":"Part 08"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const KNOWN_KEY = 'vp_known';
const WRONG_KEY = 'vp_wrong';
const store = {
  get known() { try { return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || '[]')); } catch { return new Set(); } },
  set known(set) { localStorage.setItem(KNOWN_KEY, JSON.stringify([...set])); },
  get wrong() { try { return new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]')); } catch { return new Set(); } },
  set wrong(set) { localStorage.setItem(WRONG_KEY, JSON.stringify([...set])); }
};

let known = store.known;
let wrong = store.wrong;
let mode = 'study';        // 'study' 正常学习 | 'wrong' 错题本
let queue = [];            // array of data indices
let cur = 0;               // pointer into queue
let flipped = false;
let filtered = DATA.map((_, i) => i); // current group filter

// ---------- group select ----------
const groupSel = $('groupSel');
const groups = [...new Set(DATA.map(d => d.group))];
groupSel.innerHTML = '<option value="">全部（' + DATA.length + '）</option>' +
  groups.map(g => {
    const n = DATA.filter(d => d.group === g).length;
    return `<option value="${g}">${g}（${n}）</option>`;
  }).join('');
groupSel.onchange = () => {
  filtered = DATA.map((d, i) => ({ d, i })).filter(x => !groupSel.value || x.d.group === groupSel.value).map(x => x.i);
  buildQueue();
};

// ---------- header stats / mode ----------
function updateHeader() {
  $('btnWrongBook').classList.toggle('active', mode === 'wrong');
  $('btnWrongBook').innerHTML = mode === 'wrong'
    ? '返回学习'
    : '错题本<span class="badge">' + wrong.size + '</span>';
  $('statsLine').innerHTML = mode === 'wrong'
    ? '错题待消除 <b class="red">' + wrong.size + '</b>'
    : '已掌握 <b>' + known.size + '</b> / <span>' + DATA.length + '</span>';
}

// ---------- queue ----------
function buildQueue() {
  let list = filtered.slice();
  if (mode === 'wrong') list = list.filter(i => wrong.has(DATA[i].en));
  queue = list;
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  updateHeader();
  render();
}
function restartGroup() { buildQueue(); }
function reviewUnknown() {
  queue = filtered.filter(i => !known.has(DATA[i].en));
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  render();
}

// ---------- render ----------
let backFillTimer = null;
function render() {
  if (queue.length === 0 || cur >= queue.length) { renderDone(); return; }
  const d = DATA[queue[cur]];
  const wasFlipped = flipped;
  if (backFillTimer) { clearTimeout(backFillTimer); backFillTimer = null; }
  flipped = false;
  $('card').classList.remove('flipped');
  $('btnFlip').hidden = false;
  $('btnFlip').disabled = false;
  $('btnUnknown').hidden = true;
  $('btnKnown').hidden = true;
  // 正面内容立即更新（翻回时正面后半段才可见，安全）
  $('wordFront').innerHTML = d.en;
  $('tagFront').textContent = d.group;
  $('knownDot').hidden = mode === 'wrong' || !known.has(d.en);
  $('wrongDot').hidden = !wrong.has(d.en);
  $('posFront').textContent = `${cur + 1} / ${queue.length}`;
  $('btnKnown').textContent = mode === 'wrong' ? '答对了 →' : '认识 →';
  $('btnUnknown').textContent = mode === 'wrong' ? '还没记住 ←' : '不认识 ←';
  $('progressFill').style.width = (cur / queue.length * 100) + '%';
  $('progressNum').textContent = `${cur} / ${queue.length}`;
  // 答案（背面）内容：若当前已翻转，翻回动画前半段背面仍可见，
  // 先清空避免新答案闪现，等动画过半（约 250ms）背面不可见时再填入
  if (wasFlipped) {
    $('wordBack').innerHTML = '';
    $('enBack').textContent = '';
    $('tagBack').textContent = '';
    backFillTimer = setTimeout(() => {
      $('wordBack').innerHTML = d.zh;
      $('tagBack').textContent = d.group;
      $('enBack').textContent = d.en;
      backFillTimer = null;
    }, 250);
  } else {
    $('wordBack').innerHTML = d.zh;
    $('tagBack').textContent = d.group;
    $('enBack').textContent = d.en;
  }
  updateHeader();
}

function renderDone() {
  $('study').style.display = 'none';
  $('done').hidden = false;
  $('actions').style.visibility = 'hidden';
  if (mode === 'wrong') {
    const wrongInFilter = filtered.filter(i => wrong.has(DATA[i].en)).length;
    $('doneTitle').textContent = wrongInFilter === 0 ? '错题全部消除 🎉' : '本轮错题过完 🎉';
    $('doneText').textContent = wrongInFilter === 0
      ? '当前范围的错题都已重新答对。' + (wrong.size === 0 ? '错题本已清空，继续保持！' : '其他分组还有错题，可切换分组继续。')
      : `还有 ${wrongInFilter} 张错题未消除，再练一遍直到全部答对。`;
    $('btnAgainUnknown').hidden = true;
    $('btnRestart').textContent = wrongInFilter === 0 ? '返回学习' : '再练一遍错题';
  } else {
    const unknownInFilter = filtered.filter(i => !known.has(DATA[i].en)).length;
    $('doneTitle').textContent = '本组完成 🎉';
    $('doneText').textContent = unknownInFilter === 0
      ? '太棒了！当前范围的卡片全部掌握。'
      : `本组完成，当前范围还有 ${unknownInFilter} 张未掌握。`;
    $('btnAgainUnknown').hidden = unknownInFilter === 0;
    $('btnRestart').textContent = '重新开始本组';
  }
  $('progressFill').style.width = '100%';
  $('progressNum').textContent = `${queue.length} / ${queue.length}`;
  updateHeader();
}

// ---------- interactions ----------
function flip() {
  if ($('done').hidden === false) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('btnFlip').hidden = flipped;
  $('btnUnknown').hidden = !flipped;
  $('btnKnown').hidden = !flipped;
}
function afterAnswer() {
  flipped = false;
  updateHeader();
  render();
  $('actions').style.visibility = '';
}
$('card').onclick = flip;
$('btnFlip').onclick = flip;
// 正常模式：认识=加入已掌握；错题本：答对=从错题本消除
$('btnKnown').onclick = () => {
  const d = DATA[queue[cur]];
  if (mode === 'wrong') {
    wrong.delete(d.en);
    store.wrong = wrong;
    queue.splice(cur, 1);          // 不前进，下一张移到当前位置
  } else {
    known.add(d.en);
    store.known = known;
    cur++;
  }
  afterAnswer();
};
// 任何模式下不认识都收录错题本，并排到队尾再出现
$('btnUnknown').onclick = () => {
  const d = DATA[queue[cur]];
  wrong.add(d.en);
  store.wrong = wrong;
  queue.push(queue[cur]);
  if (mode === 'wrong') queue.splice(cur, 1);
  else cur++;
  afterAnswer();
};
$('btnShuffle').onclick = () => {
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  cur = 0; render();
};
$('btnReset').onclick = () => {
  if (!confirm('确定清空所有已掌握记录？（错题本不受影响，需在错题本内答对消除）')) return;
  known = new Set(); store.known = known;
  buildQueue();
};
$('btnWrongBook').onclick = () => {
  mode = mode === 'study' ? 'wrong' : 'study';
  buildQueue();
};
$('btnAgainUnknown').onclick = () => { $('actions').style.visibility = ''; reviewUnknown(); };
$('btnRestart').onclick = () => {
  $('actions').style.visibility = '';
  if (mode === 'wrong') buildQueue(); else restartGroup();
};

document.onkeydown = e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' && !$('btnKnown').hidden) $('btnKnown').click();
  else if (e.code === 'ArrowLeft' && !$('btnUnknown').hidden) $('btnUnknown').click();
};

buildQueue();
</script>
