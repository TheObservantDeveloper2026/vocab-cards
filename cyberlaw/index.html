<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>网络安全法背诵卡 | Vocabulary Cards</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --green: #22a06b;
    --red: #e5484d;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1c2333;
    --text-sub: #6b7280;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(28, 35, 51, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f8fc 55%, #eef4f2 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 14px 16px 8px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  h1 small { color: var(--text-sub); font-weight: 500; font-size: 12px; margin-left: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  select, .btn-ghost {
    appearance: none;
    border: 1px solid #dfe3ee;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select { min-width: 130px; }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost.active { border-color: var(--red); color: var(--red); background: #fef0f0; }
  .badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 5px;
    background: var(--red);
    color: #fff;
    border-radius: 999px;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }
  .stats { margin-left: auto; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .stats b { color: var(--green); }
  .stats b.red { color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 8px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-wrap { width: 100%; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e4e8f4; border-radius: 3px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c9bff); border-radius: 3px; transition: width .25s; }
  .progress-num { font-size: 12px; color: var(--text-sub); white-space: nowrap; }

  .scene { perspective: 1400px; width: 100%; max-width: 560px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(150deg, #ffffff, #f6f8ff); }
  .word {
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700;
    word-break: break-word;
    line-height: 1.2;
  }
  .word.zh { font-size: clamp(26px, 6vw, 42px); color: var(--primary-dark); font-weight: 600; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-sub); }
  .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    color: var(--text-sub);
    background: #eef1fb;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .known-dot {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #e8f7f0;
    color: var(--green);
  }
  .wrong-dot {
    position: absolute;
    top: 40px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #fdebec;
    color: var(--red);
  }
  .pos { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: #b6bccb; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, filter .15s;
  }
  .actions button:active { transform: scale(.97); }
  #btnUnknown { background: var(--red); }
  #btnKnown { background: var(--green); }
  #btnFlip { background: var(--primary); width: 100%; max-width: 560px; flex: none; }
  .actions button[disabled] { opacity: .45; cursor: default; }

  .done-panel { text-align: center; max-width: 480px; }
  .done-panel h2 { font-size: 26px; margin-bottom: 10px; }
  .done-panel p { color: var(--text-sub); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .done-panel button {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #btnAgainUnknown { background: var(--primary); }
  #btnRestart { background: #8a93a8; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c4;
    padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
  }
  kbd {
    background:#fff;border:1px solid #dfe3ee;border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;font-size:11px;color:#5b6272;
  }
  @media (max-width: 480px) {
    .card { min-height: 250px; }
    .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>网络安全法背诵卡 <small>点击卡片 · 看问题想条文</small></h1>
  <div class="toolbar">
    <select id="groupSel"></select>
    <button class="btn-ghost" id="btnShuffle">洗牌</button>
    <button class="btn-ghost" id="btnWrongBook">错题本<span class="badge" id="wrongBadge">0</span></button>
    <button class="btn-ghost" id="btnReset">清空进度</button>
    <span class="stats" id="statsLine"></span>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progressFill"></i></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
  </div>

  <div class="scene" id="study">
    <div class="card" id="card">
      <div class="face front">
        <span class="tag" id="tagFront"></span>
        <span class="known-dot" id="knownDot" hidden>已掌握</span>
        <span class="wrong-dot" id="wrongDot" hidden>错题</span>
        <div class="word" id="wordFront"></div>
        <div class="hint">先在脑中回忆条文要点，点击卡片查看</div>
        <span class="pos" id="posFront"></span>
      </div>
      <div class="face back">
        <span class="tag" id="tagBack"></span>
        <div class="word zh" id="wordBack"></div>
        <div class="hint" id="enBack"></div>
      </div>
    </div>
  </div>

  <div class="done-panel" id="done" hidden>
    <h2 id="doneTitle">本组完成 🎉</h2>
    <p id="doneText"></p>
    <button id="btnAgainUnknown">只复习未掌握的卡片</button>
    <button id="btnRestart">重新开始本组</button>
  </div>

  <div class="actions" id="actions">
    <button id="btnFlip">翻转卡片（空格）</button>
    <button id="btnUnknown" hidden>答错 ←</button>
    <button id="btnKnown" hidden>答对 →</button>
  </div>
</main>

<footer>答错自动收录错题本 · 在错题本答对后消除 · 数据保存在本地浏览器</footer>

<script id="data" type="application/json">[{"en":"《网络安全法》的章节结构、条数与时间线？","zh":"共 7 章 81 条。<br>2016-11-7 第十二届全国人大常委会第二十四次会议通过，2017-6-1 施行；<br>2025-10-28 第十四届全国人大常委会第十八次会议修正，修改决定自 2026-1-1 施行。<br>七章：总则／支持与促进／网络运行安全／网络信息安全／监测预警与应急处置／法律责任／附则。","group":"0·速记总览"},{"en":"2025 年修正的四大要点？","zh":"①新增第3条：坚持党的领导、总体国家安全观、统筹发展和安全、网络强国；<br>②新增第20条：支持人工智能发展与安全；<br>③完善法律责任、加大处罚力度（最高可达 1000 万元罚款），新增第63条、第73条；<br>④与数据安全法、个人信息保护法、民法典、行政处罚法衔接。","group":"0·速记总览"},{"en":"必背数字有哪些？","zh":"网络日志留存 ≥ 6 个月（第23条）；<br>关键信息基础设施安全性检测评估 每年至少 1 次（第40条）；<br>从业禁止：受治安处罚 5 年内、受刑事处罚 终身不得从事网络安全管理和网络运营关键岗位（第66条）；<br>最高罚款：200 万元以上 1000 万元以下（第61、69条特别严重情形）。","group":"0·速记总览"},{"en":"全法罚款档次速记（一般运营者 / CII运营者 / 严重后果）？","zh":"一般运营者不履行等保义务（61条）：先警告可处1-5万；拒不改正或致后果5-50万；<br>CII运营者（61条2款）：可处5-10万；拒不改正或致后果10-100万；<br>严重后果50-200万、特别严重后果200-1000万；<br>对责任人：1-10万／5-20万／20-100万三档。","group":"0·速记总览"},{"en":"立法目的是什么？（第1条）","zh":"保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展。","group":"一、总则"},{"en":"适用范围？（第2条）","zh":"在中华人民共和国境内建设、运营、维护和使用网络，以及网络安全的监督管理，适用本法。","group":"一、总则"},{"en":"网络安全工作的根本原则？（第3条·2025新增）","zh":"坚持中国共产党的领导，贯彻总体国家安全观，统筹发展和安全，推进网络强国建设。","group":"一、总则"},{"en":"国家发展网络安全的基本方针？（第4条）","zh":"坚持网络安全与信息化发展并重，遵循“积极利用、科学发展、依法管理、确保安全”的方针。","group":"一、总则"},{"en":"国家如何应对网络安全风险与威胁？（第6条）","zh":"采取措施，监测、防御、处置来源于境内外的网络安全风险和威胁；保护关键信息基础设施免受攻击、侵入、干扰和破坏；依法惩治网络违法犯罪活动。","group":"一、总则"},{"en":"网络安全监管职责如何分工？（第9条）","zh":"国家网信部门负责统筹协调网络安全工作和相关监督管理；<br>国务院电信主管部门、公安部门和其他有关机关在各自职责范围内负责网络安全保护和监督管理；<br>县级以上地方有关部门职责按国家规定确定。","group":"一、总则"},{"en":"网络运营者经营活动的基本义务？（第10条）","zh":"遵守法律行政法规，尊重社会公德，遵守商业道德，诚实信用，履行网络安全保护义务，接受政府和社会监督，承担社会责任。","group":"一、总则"},{"en":"建设运营网络应保障数据的哪“三性”？（第11条）","zh":"完整性、保密性、可用性。<br>须依法依规和国家标准强制性要求，采取技术措施和其他必要措施，保障网络安全稳定运行、有效应对网络安全事件。","group":"一、总则"},{"en":"个人和组织使用网络不得从事哪些行为？（第13条2款）","zh":"不得危害网络安全；不得利用网络：危害国家安全荣誉利益、煽动颠覆政权/推翻社会主义制度、煽动分裂国家破坏统一、宣扬恐怖主义极端主义、宣扬民族仇恨歧视、传播暴力淫秽色情信息、编造传播虚假信息扰乱秩序，以及侵害他人名誉、隐私、知识产权等合法权益。","group":"一、总则"},{"en":"对危害网络安全行为的举报与举报人保护？（第15条）","zh":"任何个人和组织有权向网信、电信、公安等部门举报；<br>收到举报的部门应及时依法处理，不属本部门职责的应及时移送；<br>有关部门应对举报人信息保密，保护举报人合法权益。","group":"一、总则"},{"en":"国家网络安全标准体系如何建立？（第16条）","zh":"国务院标准化行政主管部门和其他有关部门组织制定并适时修订网络安全管理及网络产品、服务、运行安全的国家标准、行业标准；支持企业、研究机构、高校、行业组织参与制定。","group":"二、支持与促进"},{"en":"国家对人工智能的态度与规定？（第20条·2025新增）","zh":"支持人工智能基础理论研究和算法等关键技术研发，推进训练数据资源、算力等基础设施建设，完善人工智能伦理规范，加强风险监测评估和安全监管，促进人工智能应用和健康发展；<br>支持创新网络安全管理方式，运用人工智能等新技术提升网络安全保护水平。","group":"二、支持与促进"},{"en":"网络安全宣传教育由谁负责？（第21条）","zh":"各级政府及有关部门组织开展经常性网络安全宣传教育并指导督促；大众传播媒介应有针对性地面向社会进行宣传教育。","group":"二、支持与促进"},{"en":"网络安全等级保护制度下运营者的五项安全保护义务？（第23条）","zh":"①制定内部安全管理制度和操作规程，确定网络安全负责人，落实保护责任；<br>②采取防范计算机病毒、网络攻击、网络侵入等的技术措施；<br>③采取监测、记录网络运行状态和网络安全事件的技术措施，网络日志留存不少于六个月；<br>④采取数据分类、重要数据备份和加密等措施；<br>⑤法律、行政法规规定的其他义务。","group":"三、运行安全（一般规定）"},{"en":"网络产品、服务提供者的义务？（第24条）","zh":"①符合国家标准强制性要求，不得设置恶意程序；<br>②发现安全缺陷、漏洞等风险应立即采取补救措施，按规定及时告知用户并向主管部门报告；<br>③持续提供安全维护，规定或约定期限内不得终止；<br>④收集用户信息应明示并取得同意，涉及个人信息的还须遵守个人信息保护规定。","group":"三、运行安全（一般规定）"},{"en":"网络关键设备和网络安全专用产品如何管理？（第25条）","zh":"应按国家标准强制性要求，由具备资格的机构安全认证合格或安全检测符合要求后，方可销售或提供；<br>国家网信部门会同有关部门制定、公布目录，推动认证、检测结果互认，避免重复认证检测。","group":"三、运行安全（一般规定）"},{"en":"网络实名制覆盖哪些场景？（第26条）","zh":"办理网络接入、域名注册，固定/移动电话入网，提供信息发布、即时通讯等服务，签订协议或确认提供服务时应要求用户提供真实身份信息；不提供的不得提供相关服务。<br>国家实施网络可信身份战略。","group":"三、运行安全（一般规定）"},{"en":"网络运营者的应急预案义务？（第27条）","zh":"应当制定网络安全事件应急预案，及时处置系统漏洞、计算机病毒、网络攻击、网络侵入等安全风险；<br>发生危害网络安全事件时，立即启动应急预案、采取补救措施，并按规定向主管部门报告。","group":"三、运行安全（一般规定）"},{"en":"开展网络安全信息发布活动有何限制？（第28条）","zh":"开展网络安全认证、检测、风险评估等活动，或向社会发布系统漏洞、计算机病毒、网络攻击、网络侵入等网络安全信息，应当遵守国家有关规定。","group":"三、运行安全（一般规定）"},{"en":"任何个人和组织被禁止的危害网络安全行为？（第29条）","zh":"不得非法侵入他人网络、干扰网络正常功能、窃取网络数据；<br>不得提供专门用于上述活动的程序、工具；<br>明知他人从事危害网络安全活动的，不得为其提供技术支持、广告推广、支付结算等帮助。","group":"三、运行安全（一般规定）"},{"en":"网络运营者对执法机关负有什么义务？（第30条）","zh":"应当为公安机关、国家安全机关依法维护国家安全和侦查犯罪的活动提供技术支持和协助。","group":"三、运行安全（一般规定）"},{"en":"监管部门履职中获取的信息用途限制？（第32条）","zh":"只能用于维护网络安全的需要，不得用于其他用途。","group":"三、运行安全（一般规定）"},{"en":"关键信息基础设施（CII）的范围与保护原则？（第33条）","zh":"公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务等重要行业领域，以及一旦遭破坏、丧失功能或数据泄露可能严重危害国家安全、国计民生、公共利益的设施；<br>在网络安全等级保护制度基础上实行重点保护；具体范围和保护办法由国务院制定。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 建设的“三同步”要求？（第35条）","zh":"建设关键信息基础设施应确保支持业务稳定、持续运行的性能，并保证安全技术措施同步规划、同步建设、同步使用。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 运营者除第23条外还应履行的义务？（第36条）","zh":"①设置专门安全管理机构和安全管理负责人，对负责人和关键岗位人员进行安全背景审查；<br>②定期对从业人员进行网络安全教育、技术培训和技能考核；<br>③对重要系统和数据库进行容灾备份；<br>④制定网络安全事件应急预案并定期演练；<br>⑤法律、行政法规规定的其他义务。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 采购的国家安全审查？（第37条）","zh":"采购网络产品和服务，可能影响国家安全的，应当通过国家网信部门会同国务院有关部门组织的国家安全审查。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 采购合同要求？（第38条）","zh":"应按规定与提供者签订安全保密协议，明确安全和保密义务与责任。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 数据本地化与出境要求？（第39条）","zh":"在境内运营中收集和产生的个人信息和重要数据应当在境内存储；<br>因业务需要确需向境外提供的，应按国家网信部门会同有关部门制定的办法进行安全评估；法律、行政法规另有规定的从其规定。","group":"三、运行安全（关键信息基础设施）"},{"en":"CII 检测评估频次与报送？（第40条）","zh":"应当自行或委托网络安全服务机构，对其网络安全性和可能存在的风险每年至少进行一次检测评估，并将检测评估情况和改进措施报送相关负责CII安全保护工作的部门。","group":"三、运行安全（关键信息基础设施）"},{"en":"国家网信部门保护 CII 的四项统筹措施？（第41条）","zh":"①对安全风险抽查检测、提出改进措施，必要时委托服务机构检测评估；<br>②定期组织CII运营者应急演练；<br>③促进部门、运营者、研究及服务机构间的网络安全信息共享；<br>④对网络安全事件应急处置与网络功能恢复提供技术支持和协助。","group":"三、运行安全（关键信息基础设施）"},{"en":"网络运营者的用户信息保护总体要求？（第42条）","zh":"应当对收集的用户信息严格保密，建立健全用户信息保护制度；<br>处理个人信息应遵守本法和《民法典》《个人信息保护法》等法律、行政法规（第2款为2025新增衔接条款）。","group":"四、网络信息安全"},{"en":"收集使用个人信息的“三原则”与规则？（第43条）","zh":"遵循合法、正当、必要原则；公开收集使用规则，明示目的、方式和范围，并经被收集者同意；<br>不得收集与所提供服务无关的个人信息，不得违法违约收集使用，应依法依约处理保存的个人信息。","group":"四、网络信息安全"},{"en":"个人信息安全与泄露处置义务？（第44条）","zh":"不得泄露、篡改、毁损收集的个人信息；未经同意不得向他人提供（经处理无法识别特定个人且不能复原的除外）；<br>应采取技术等措施确保信息安全；发生或可能发生泄露、毁损、丢失时，立即补救，按规定及时告知用户并向主管部门报告。","group":"四、网络信息安全"},{"en":"个人对其信息享有什么权利？（第45条）","zh":"发现运营者违法违约收集使用其个人信息的，有权要求删除；<br>发现收集存储的个人信息有错误的，有权要求更正；运营者应当采取措施予以删除或更正。","group":"四、网络信息安全"},{"en":"个人信息获取、买卖的禁止规定？（第46条）","zh":"任何个人和组织不得窃取或者以其他非法方式获取个人信息，不得非法出售或者非法向他人提供个人信息。","group":"四、网络信息安全"},{"en":"发现违法信息，网络运营者应采取哪些处置？（第49条）","zh":"发现法律、行政法规禁止发布或传输的信息，应当立即停止传输，采取消除等处置措施，防止信息扩散，保存有关记录，并向有关主管部门报告。","group":"四、网络信息安全"},{"en":"电子信息、应用软件及相关服务提供者的义务？（第50条）","zh":"发送的电子信息、提供的应用软件不得设置恶意程序，不得含有法律行政法规禁止发布或传输的信息；<br>电子信息发送服务提供者和应用软件下载服务提供者应履行安全管理义务，明知用户有上述行为的，应停止提供服务、采取消除等措施、保存记录并报告。","group":"四、网络信息安全"},{"en":"投诉举报与配合监督检查义务？（第51条）","zh":"网络运营者应建立网络信息安全投诉、举报制度，公布方式等信息，及时受理处理；对网信部门和有关部门依法实施的监督检查应予配合。","group":"四、网络信息安全"},{"en":"监管部门发现违法信息可采取什么措施？（第52条）","zh":"要求网络运营者停止传输、采取消除等处置措施、保存有关记录；<br>对来源于境外的违法信息，应当通知有关机构采取技术措施和其他必要措施阻断传播。","group":"四、网络信息安全"},{"en":"网络安全监测预警和信息通报制度？（第53条）","zh":"国家建立该制度；国家网信部门统筹协调有关部门加强信息收集、分析和通报，按规定统一发布网络安全监测预警信息。","group":"五、监测预警与应急处置"},{"en":"网络安全事件应急预案机制与分级？（第55条）","zh":"国家网信部门协调建立健全风险评估和应急工作机制，制定应急预案并定期演练；CII保护部门制定本行业本领域预案并定期演练；<br>应急预案应按危害程度、影响范围等因素对事件分级并规定相应处置措施。","group":"五、监测预警与应急处置"},{"en":"安全风险增大时，省级以上部门可采取哪些措施？（第56条）","zh":"①要求有关部门、机构和人员及时收集、报告信息，加强监测；<br>②组织分析评估，预测事件发生可能性、影响范围和危害程度；<br>③向社会发布风险预警，发布避免、减轻危害的措施。","group":"五、监测预警与应急处置"},{"en":"发生网络安全事件如何处置？（第57条）","zh":"立即启动应急预案，调查评估，要求网络运营者采取技术措施和其他必要措施，消除隐患、防止危害扩大，并及时向社会发布与公众有关的警示信息。","group":"五、监测预警与应急处置"},{"en":"什么情况下可以“约谈”？对象是谁？（第58条）","zh":"省级以上政府有关部门发现网络存在较大安全风险或发生安全事件的，可按权限和程序约谈该网络运营者的法定代表人或主要负责人；运营者应按要求采取措施、整改、消除隐患。","group":"五、监测预警与应急处置"},{"en":"什么情况下可对网络通信采取临时限制措施？（第60条）","zh":"因维护国家安全和社会公共秩序、处置重大突发社会安全事件的需要，经国务院决定或批准，可以在特定区域对网络通信采取限制等临时措施。","group":"五、监测预警与应急处置"},{"en":"运营者不履行第23、27条等保义务的处罚？（第61条1款）","zh":"责令改正、给予警告，可以处1万-5万元罚款；<br>拒不改正或导致危害网络安全等后果的，处5万-50万元罚款，对直接负责的主管人员和其他直接责任人员处1万-10万元罚款。","group":"六、法律责任"},{"en":"CII 运营者不履行第35、36、38、40条义务的处罚？（第61条2款）","zh":"责令改正、警告，可以处5万-10万元罚款；<br>拒不改正或导致危害后果的，处10万-100万元罚款，对直接负责的主管人员和其他直接责任人员处1万-10万元罚款。","group":"六、法律责任"},{"en":"造成严重／特别严重后果时的加重处罚？（第61条3款·2025新增档次）","zh":"造成大量数据泄露、CII丧失局部功能等严重后果：处50万-200万元，责任人5万-20万元；<br>造成CII丧失主要功能等特别严重后果：处200万-1000万元，责任人20万-100万元。","group":"六、法律责任"},{"en":"设置恶意程序、不补救漏洞、擅自终止安全维护的处罚？（第62条）","zh":"责令改正、警告；拒不改正或导致危害后果的，处5万-50万元罚款，对直接负责的主管人员处1万-10万元；<br>有第①②项行为并造成第61条3款后果的，依照该款重罚。","group":"六、法律责任"},{"en":"销售提供未经认证检测的关键设备/专用产品的处罚？（第63条·2025新增）","zh":"责令停止销售或提供、警告、没收违法所得；<br>无违法所得或不足10万元的，并处2万-10万元罚款；违法所得10万元以上的，并处违法所得1-5倍罚款；<br>情节严重的，可责令暂停业务、停业整顿、吊销许可证或营业执照。","group":"六、法律责任"},{"en":"违反实名制（第26条）的处罚？（第64条）","zh":"责令改正；拒不改正或情节严重的，处5万-50万元罚款，并可责令暂停相关业务、停业整顿、关闭网站或应用程序、吊销许可证或营业执照；<br>对直接负责的主管人员和其他直接责任人员处1万-10万元罚款。","group":"六、法律责任"},{"en":"违规开展认证检测评估或发布网络安全信息的处罚？（第65条）","zh":"责令改正、警告，可处1万-10万元罚款；拒不改正或情节严重的，处10万-100万元，并可责令暂停业务、停业整顿、关闭网站或应用程序、吊销证照；责任人处1万-10万元。","group":"六、法律责任"},{"en":"从事黑客活动或提供程序工具、帮助的处罚？（第66条）","zh":"尚不构成犯罪的，由公安机关没收违法所得，处5日以下拘留，可并处5万-50万元；情节较重处5-15日拘留，可并处10万-100万元；<br>单位有此行为处10万-100万元，并罚责任人；<br>受治安处罚者5年内、受刑事处罚者终身不得从事网络安全管理和网络运营关键岗位工作。","group":"六、法律责任"},{"en":"CII 采购使用未过安全审查产品服务的处罚？（第67条）","zh":"责令限期改正、停止使用、消除对国家安全的影响，处采购金额1-10倍罚款；<br>对直接负责的主管人员和其他直接责任人员处1万-10万元罚款。","group":"六、法律责任"},{"en":"设立违法犯罪网站群组、发布违法犯罪信息的处罚？（第68条）","zh":"尚不构成犯罪的，由公安机关处5日以下拘留，可并处1万-10万元；情节较重处5-15日拘留，可并处5万-50万元；关闭相关网站、通讯群组；<br>单位处10万-50万元，并对责任人依前款处罚。","group":"六、法律责任"},{"en":"未处置违法信息或拒不按要求处置的处罚？（第69条）","zh":"责令改正、警告、通报，可处5万-50万元；拒不改正或情节严重处50万-200万元，可暂停业务、停业整顿、关闭网站或应用程序、吊销证照，责任人5万-20万元；<br>造成特别严重影响、后果的，处200万-1000万元，责任人20万-100万元。","group":"六、法律责任"},{"en":"拒绝阻碍监督检查、拒不提供技术协助的处罚？（第70条）","zh":"责令改正；拒不改正或情节严重的，处5万-50万元罚款；对直接负责的主管人员和其他直接责任人员处1万-10万元罚款。","group":"六、法律责任"},{"en":"哪些行为改为依其他法律法规“衔接性”处理处罚？（第71条）","zh":"①发布传输第13条2款等禁止信息的；<br>②违反第24条3款、第43-45条侵害个人信息权益的（适用个人信息保护法等）；<br>③违反第39条在境外存储或向境外提供个人信息和重要数据的（适用数据安全法等）；<br>非法获取、出售、提供个人信息尚不构成犯罪的，由公安机关依有关法律法规处罚。","group":"六、法律责任"},{"en":"违法信息公示与从轻减轻情节？（第72、73条）","zh":"第72条：有本法规定的违法行为的，依照规定记入信用档案并予以公示；<br>第73条（2025新增）：具有《行政处罚法》规定的从轻、减轻或不予处罚情形的，依法从轻、减轻或不予处罚。","group":"六、法律责任"},{"en":"政务网络、监管部门违法及责任竞合如何处理？（第74-76条）","zh":"第74条：国家机关政务网络运营者不履行义务的，由上级或有关机关责令改正，对责任人依法给予处分；<br>第75条：监管部门将履职获取信息挪作他用，或工作人员玩忽职守、滥用职权、徇私舞弊尚不构成犯罪的，依法给予处分；<br>第76条：造成损害承担民事责任；构成违警的给予治安管理处罚；构成犯罪的追究刑事责任。","group":"六、法律责任"},{"en":"域外适用与制裁？（第77条·2025修改扩大）","zh":"境外的机构、组织、个人从事危害我国网络安全活动的，依法追究法律责任；<br>造成严重后果的，国务院公安部门和有关部门可决定对其采取冻结财产或其他必要制裁措施。","group":"六、法律责任"},{"en":"“网络”的法定含义？（第78条一）","zh":"由计算机或者其他信息终端及相关设备组成的，按照一定的规则和程序对信息进行收集、存储、传输、交换、处理的系统。","group":"七、附则"},{"en":"“网络安全”的法定含义？（第78条二）","zh":"通过采取必要措施，防范对网络的攻击、侵入、干扰、破坏和非法使用以及意外事故，使网络处于稳定可靠运行的状态，以及保障网络数据完整性、保密性、可用性的能力。","group":"七、附则"},{"en":"“网络运营者”的法定含义？（第78条三）","zh":"网络的所有者、管理者和网络服务提供者。","group":"七、附则"},{"en":"“网络数据”“个人信息”的法定含义？（第78条四、五）","zh":"网络数据：通过网络收集、存储、传输、处理和产生的各种电子数据；<br>个人信息：以电子或其他方式记录的、能够单独或与其他信息结合识别自然人个人身份的各种信息，包括但不限于姓名、出生日期、身份证件号码、个人生物识别信息、住址、电话号码等。","group":"七、附则"},{"en":"涉密网络、军事网络与施行日期？（第79-81条）","zh":"第79条：存储、处理涉及国家秘密信息的网络，还应遵守保密法律、行政法规；<br>第80条：军事网络的安全保护由中央军事委员会另行规定；<br>第81条：本法自2017年6月1日起施行。","group":"七、附则"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const KNOWN_KEY = 'vl_known';
const WRONG_KEY = 'vl_wrong';
const store = {
  get known() { try { return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || '[]')); } catch { return new Set(); } },
  set known(set) { localStorage.setItem(KNOWN_KEY, JSON.stringify([...set])); },
  get wrong() { try { return new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]')); } catch { return new Set(); } },
  set wrong(set) { localStorage.setItem(WRONG_KEY, JSON.stringify([...set])); }
};

let known = store.known;
let wrong = store.wrong;
let mode = 'study';        // 'study' 正常学习 | 'wrong' 错题本
let queue = [];            // array of data indices
let cur = 0;               // pointer into queue
let flipped = false;
let filtered = DATA.map((_, i) => i); // current group filter

// ---------- group select ----------
const groupSel = $('groupSel');
const groups = [...new Set(DATA.map(d => d.group))];
groupSel.innerHTML = '<option value="">全部（' + DATA.length + '）</option>' +
  groups.map(g => {
    const n = DATA.filter(d => d.group === g).length;
    return `<option value="${g}">${g}（${n}）</option>`;
  }).join('');
groupSel.onchange = () => {
  filtered = DATA.map((d, i) => ({ d, i })).filter(x => !groupSel.value || x.d.group === groupSel.value).map(x => x.i);
  buildQueue();
};

// ---------- header stats / mode ----------
function updateHeader() {
  $('btnWrongBook').classList.toggle('active', mode === 'wrong');
  $('btnWrongBook').innerHTML = mode === 'wrong'
    ? '返回学习'
    : '错题本<span class="badge">' + wrong.size + '</span>';
  $('statsLine').innerHTML = mode === 'wrong'
    ? '错题待消除 <b class="red">' + wrong.size + '</b>'
    : '已掌握 <b>' + known.size + '</b> / <span>' + DATA.length + '</span>';
}

// ---------- queue ----------
function buildQueue() {
  let list = filtered.slice();
  if (mode === 'wrong') list = list.filter(i => wrong.has(DATA[i].en));
  queue = list;
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  updateHeader();
  render();
}
function restartGroup() { buildQueue(); }
function reviewUnknown() {
  queue = filtered.filter(i => !known.has(DATA[i].en));
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  render();
}

// ---------- render ----------
function render() {
  if (queue.length === 0 || cur >= queue.length) { renderDone(); return; }
  const d = DATA[queue[cur]];
  $('wordFront').textContent = d.en;
  $('tagFront').textContent = d.group;
  $('knownDot').hidden = mode === 'wrong' || !known.has(d.en);
  $('wrongDot').hidden = !wrong.has(d.en);
  $('posFront').textContent = `${cur + 1} / ${queue.length}`;
  $('wordBack').textContent = d.zh;
  $('tagBack').textContent = d.group;
  $('enBack').textContent = d.en;
  flipped = false;
  $('card').classList.remove('flipped');
  $('btnFlip').hidden = false;
  $('btnFlip').disabled = false;
  $('btnUnknown').hidden = true;
  $('btnKnown').hidden = true;
  $('btnKnown').textContent = mode === 'wrong' ? '答对了 →' : '答对 →';
  $('btnUnknown').textContent = mode === 'wrong' ? '还没记住 ←' : '答错 ←';
  $('progressFill').style.width = (cur / queue.length * 100) + '%';
  $('progressNum').textContent = `${cur} / ${queue.length}`;
  updateHeader();
}

function renderDone() {
  $('study').style.display = 'none';
  $('done').hidden = false;
  $('actions').style.visibility = 'hidden';
  if (mode === 'wrong') {
    const wrongInFilter = filtered.filter(i => wrong.has(DATA[i].en)).length;
    $('doneTitle').textContent = wrongInFilter === 0 ? '错题全部消除 🎉' : '本轮错题过完 🎉';
    $('doneText').textContent = wrongInFilter === 0
      ? '当前范围的错题都已重新答对。' + (wrong.size === 0 ? '错题本已清空，继续保持！' : '其他分组还有错题，可切换分组继续。')
      : `还有 ${wrongInFilter} 张错题未消除，再练一遍直到全部答对。`;
    $('btnAgainUnknown').hidden = true;
    $('btnRestart').textContent = wrongInFilter === 0 ? '返回学习' : '再练一遍错题';
  } else {
    const unknownInFilter = filtered.filter(i => !known.has(DATA[i].en)).length;
    $('doneTitle').textContent = '本组完成 🎉';
    $('doneText').textContent = unknownInFilter === 0
      ? '太棒了！当前范围的卡片全部掌握。'
      : `本组完成，当前范围还有 ${unknownInFilter} 张未掌握。`;
    $('btnAgainUnknown').hidden = unknownInFilter === 0;
    $('btnRestart').textContent = '重新开始本组';
  }
  $('progressFill').style.width = '100%';
  $('progressNum').textContent = `${queue.length} / ${queue.length}`;
  updateHeader();
}

// ---------- interactions ----------
function flip() {
  if ($('done').hidden === false) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('btnFlip').hidden = flipped;
  $('btnUnknown').hidden = !flipped;
  $('btnKnown').hidden = !flipped;
}
function afterAnswer() {
  flipped = false;
  updateHeader();
  render();
  $('actions').style.visibility = '';
}
$('card').onclick = flip;
$('btnFlip').onclick = flip;
// 正常模式：认识=加入已掌握；错题本：答对=从错题本消除
$('btnKnown').onclick = () => {
  const d = DATA[queue[cur]];
  if (mode === 'wrong') {
    wrong.delete(d.en);
    store.wrong = wrong;
    queue.splice(cur, 1);          // 不前进，下一张移到当前位置
  } else {
    known.add(d.en);
    store.known = known;
    cur++;
  }
  afterAnswer();
};
// 任何模式下不认识都收录错题本，并排到队尾再出现
$('btnUnknown').onclick = () => {
  const d = DATA[queue[cur]];
  wrong.add(d.en);
  store.wrong = wrong;
  queue.push(queue[cur]);
  if (mode === 'wrong') queue.splice(cur, 1);
  else cur++;
  afterAnswer();
};
$('btnShuffle').onclick = () => {
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  cur = 0; render();
};
$('btnReset').onclick = () => {
  if (!confirm('确定清空所有已掌握记录？（错题本不受影响，需在错题本内答对消除）')) return;
  known = new Set(); store.known = known;
  buildQueue();
};
$('btnWrongBook').onclick = () => {
  mode = mode === 'study' ? 'wrong' : 'study';
  buildQueue();
};
$('btnAgainUnknown').onclick = () => { $('actions').style.visibility = ''; reviewUnknown(); };
$('btnRestart').onclick = () => {
  $('actions').style.visibility = '';
  if (mode === 'wrong') buildQueue(); else restartGroup();
};

document.onkeydown = e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' && !$('btnKnown').hidden) $('btnKnown').click();
  else if (e.code === 'ArrowLeft' && !$('btnUnknown').hidden) $('btnUnknown').click();
};

buildQueue();
</script>
</body>
</html>
