<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>英语四级语法卡片 | Vocabulary Cards</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --green: #22a06b;
    --red: #e5484d;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1c2333;
    --text-sub: #6b7280;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(28, 35, 51, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f8fc 55%, #eef4f2 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 14px 16px 8px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  h1 small { color: var(--text-sub); font-weight: 500; font-size: 12px; margin-left: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  select, .btn-ghost {
    appearance: none;
    border: 1px solid #dfe3ee;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select { min-width: 130px; }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .stats { margin-left: auto; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .stats b { color: var(--green); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 8px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-wrap { width: 100%; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e4e8f4; border-radius: 3px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c9bff); border-radius: 3px; transition: width .25s; }
  .progress-num { font-size: 12px; color: var(--text-sub); white-space: nowrap; }

  .scene { perspective: 1400px; width: 100%; max-width: 560px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(150deg, #ffffff, #f6f8ff); }
  .word {
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700;
    word-break: break-word;
    line-height: 1.2;
  }
  .word.zh { font-size: clamp(26px, 6vw, 42px); color: var(--primary-dark); font-weight: 600; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-sub); }
  .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    color: var(--text-sub);
    background: #eef1fb;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .known-dot {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #e8f7f0;
    color: var(--green);
  }
  .pos { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: #b6bccb; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, filter .15s;
  }
  .actions button:active { transform: scale(.97); }
  #btnUnknown { background: var(--red); }
  #btnKnown { background: var(--green); }
  #btnFlip { background: var(--primary); width: 100%; max-width: 560px; flex: none; }
  .actions button[disabled] { opacity: .45; cursor: default; }

  .done-panel { text-align: center; max-width: 480px; }
  .done-panel h2 { font-size: 26px; margin-bottom: 10px; }
  .done-panel p { color: var(--text-sub); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .done-panel button {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #btnAgainUnknown { background: var(--primary); }
  #btnRestart { background: #8a93a8; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c4;
    padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
  }
  kbd {
    background:#fff;border:1px solid #dfe3ee;border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;font-size:11px;color:#5b6272;
  }
  @media (max-width: 480px) {
    .card { min-height: 250px; }
    .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>英语四级语法卡片 <small>点击卡片 · 看考点想结构</small></h1>
  <div class="toolbar">
    <select id="groupSel"></select>
    <button class="btn-ghost" id="btnShuffle">洗牌</button>
    <button class="btn-ghost" id="btnReset">清空进度</button>
    <span class="stats">已掌握 <b id="knownCount">0</b> / <span id="totalCount">0</span></span>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progressFill"></i></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
  </div>

  <div class="scene" id="study">
    <div class="card" id="card">
      <div class="face front">
        <span class="tag" id="tagFront"></span>
        <span class="known-dot" id="knownDot" hidden>已掌握</span>
        <div class="word" id="wordFront"></div>
        <div class="hint">想一想中文意思，点击卡片查看</div>
        <span class="pos" id="posFront"></span>
      </div>
      <div class="face back">
        <span class="tag" id="tagBack"></span>
        <div class="word zh" id="wordBack"></div>
        <div class="hint" id="enBack"></div>
      </div>
    </div>
  </div>

  <div class="done-panel" id="done" hidden>
    <h2>本组完成 🎉</h2>
    <p id="doneText"></p>
    <button id="btnAgainUnknown">只复习未掌握的卡片</button>
    <button id="btnRestart">重新开始本组</button>
  </div>

  <div class="actions" id="actions">
    <button id="btnFlip">翻转卡片（空格）</button>
    <button id="btnUnknown" hidden>不认识 ←</button>
    <button id="btnKnown" hidden>认识 →</button>
  </div>
</main>

<footer>手机端与电脑端通用 · 数据保存在本地浏览器</footer>

 语气更弱","group":"情态动词"},{"en":"must","zh":"必须、肯定推测<br>mustn’t 禁止；needn’t 不必","group":"情态动词"},{"en":"should/ought to","zh":"应该<br>表建议、义务","group":"情态动词"},{"en":"need/dare","zh":"情态用于否定/疑问；实义用于肯定<br>need to do; dare to do","group":"情态动词"},{"en":"used to","zh":"used to do; be used to doing; be used to do<br>过去常常；习惯于；被用来","group":"情态动词"},{"en":"情态 + have done","zh":"must have done; can’t have done; should have done; needn’t have done<br>must 推测否定用 can’t","group":"情态动词"},{"en":"---","zh":"---<br>---","group":"比较级"},{"en":"原级","zh":"as...as; not so/as...as<br>和……一样/不如","group":"比较级"},{"en":"比较级","zh":"more...than<br>修饰词：much/far/even/still/a lot，不用 very","group":"比较级"},{"en":"the more...the more","zh":"The more you read, the more you know.<br>越……越……","group":"比较级"},{"en":"比较级 + and + 比较级","zh":"more and more<br>越来越……","group":"比较级"},{"en":"最高级","zh":"the most...; one of the most... + 复数 + 单谓语<br>One of the best students is...","group":"比较级"},{"en":"倍数","zh":"twice as big as; twice the size of<br>倍数表达","group":"比较级"},{"en":"特殊","zh":"superior/inferior/senior/junior to<br>不用 than","group":"比较级"},{"en":"否定比较","zh":"no more than 只不过；not more than 不超过<br>no less than 多达","group":"比较级"},{"en":"---","zh":"---<br>---","group":"连词与平行结构"},{"en":"并列连词","zh":"and/but/or/so/for/yet/nor<br>连接并列成分","group":"连词与平行结构"},{"en":"关联连词","zh":"both...and; either...or; neither...nor; not only...but also; not...but<br>连接成分要一致","group":"连词与平行结构"},{"en":"平行结构","zh":"and/or/but 连接同类成分<br>to do/do/doing 要一致","group":"连词与平行结构"},{"en":"不连用","zh":"because 与 so；although 与 but<br>不能同时出现","group":"连词与平行结构"},{"en":"not only 句首","zh":"Not only did he pass, but he also got high marks.<br>前一分句倒装","group":"连词与平行结构"},{"en":"---","zh":"---<br>---","group":"代词与介词"},{"en":"it","zh":"形式主语/宾语<br>It is important to learn English.","group":"代词与介词"},{"en":"one/that/those","zh":"替代前文名词<br>The weather in Beijing is colder than that in Guangzhou.","group":"代词与介词"},{"en":"another/other/others/the other/the others","zh":"不定、剩 <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const store = {
  get known() { try { return new Set(JSON.parse(localStorage.getItem('vg_known') || '[]')); } catch { return new Set(); } },
  set known(set) { localStorage.setItem('vg_known', JSON.stringify([...set])); }
};

let known = store.known;
let queue = [];          // array of data indices
let cur = 0;             // pointer into queue
let flipped = false;
let filtered = DATA.map((_, i) => i); // current group filter

// ---------- group select ----------
const groupSel = $('groupSel');
const groups = [...new Set(DATA.map(d => d.group))];
groupSel.innerHTML = '<option value="">全部单词（' + DATA.length + '）</option>' +
  groups.map(g => {
    const n = DATA.filter(d => d.group === g).length;
    return `<option value="${g}">${g}（${n}）</option>`;
  }).join('');
groupSel.onchange = () => { filtered = DATA.map((d, i) => ({ d, i })).filter(x => !groupSel.value || x.d.group === groupSel.value).map(x => x.i); buildQueue(); };
$('totalCount').textContent = DATA.length;

// ---------- queue ----------
function buildQueue(keepUnknownOnly = false) {
  let list = filtered.slice();
  if (keepUnknownOnly) list = list.filter(i => !known.has(DATA[i].en));
  if (keepUnknownOnly && list.length === 0) { restartGroup(); return; }
  queue = list;
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  render();
}
function restartGroup() { buildQueue(false); }

// ---------- render ----------
function render() {
  if (queue.length === 0) { renderDone(); return; }
  if (cur >= queue.length) { renderDone(); return; }
  const d = DATA[queue[cur]];
  $('wordFront').textContent = d.en;
  $('tagFront').textContent = d.group;
  $('knownDot').hidden = !known.has(d.en);
  $('posFront').textContent = `${cur + 1} / ${queue.length}`;
  $('wordBack').textContent = d.zh;
  $('tagBack').textContent = d.group;
  $('enBack').textContent = d.en;
  flipped = false;
  $('card').classList.remove('flipped');
  $('btnFlip').hidden = false;
  $('btnFlip').disabled = false;
  $('btnUnknown').hidden = true;
  $('btnKnown').hidden = true;
  $('progressFill').style.width = (cur / queue.length * 100) + '%';
  $('progressNum').textContent = `${cur} / ${queue.length}`;
  $('knownCount').textContent = known.size;
}

function renderDone() {
  $('study').style.display = 'none';
  $('done').hidden = false;
  $('actions').style.visibility = 'hidden';
  const unknownInFilter = filtered.filter(i => !known.has(DATA[i].en)).length;
  $('doneText').textContent = unknownInFilter === 0
    ? '太棒了！当前范围的卡片全部掌握。'
    : `本组完成，当前范围还有 ${unknownInFilter} 张未掌握。`;
  $('btnAgainUnknown').hidden = unknownInFilter === 0;
  $('progressFill').style.width = '100%';
  $('progressNum').textContent = `${queue.length} / ${queue.length}`;
  $('knownCount').textContent = known.size;
}

// ---------- interactions ----------
function flip() {
  if ($('done').hidden === false) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('btnFlip').hidden = flipped;
  $('btnUnknown').hidden = !flipped;
  $('btnKnown').hidden = !flipped;
}
function next() {
  cur++;
  render();
  $('actions').style.visibility = '';
}
$('card').onclick = flip;
$('btnFlip').onclick = flip;
$('btnKnown').onclick = () => { known.add(DATA[queue[cur]].en); store.known = known; next(); };
$('btnUnknown').onclick = () => { queue.push(queue[cur]); next(); }; // re-queue at end
$('btnShuffle').onclick = () => {
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  cur = 0; render();
};
$('btnReset').onclick = () => {
  if (!confirm('确定清空所有已掌握记录？')) return;
  known = new Set(); store.known = known;
  buildQueue();
};
$('btnAgainUnknown').onclick = () => { $('actions').style.visibility = ''; buildQueue(true); };
$('btnRestart').onclick = () => { $('actions').style.visibility = ''; restartGroup(); };

document.onkeydown = e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' && !$('btnKnown').hidden) $('btnKnown').click();
  else if (e.code === 'ArrowLeft' && !$('btnUnknown').hidden) $('btnUnknown').click();
};

buildQueue();
</script>
</body>
</html>
