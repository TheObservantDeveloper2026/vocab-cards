<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>英语词汇卡 | Vocabulary Cards</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --green: #22a06b;
    --red: #e5484d;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1c2333;
    --text-sub: #6b7280;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(28, 35, 51, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f8fc 55%, #eef4f2 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 14px 16px 8px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  h1 small { color: var(--text-sub); font-weight: 500; font-size: 12px; margin-left: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  select, .btn-ghost {
    appearance: none;
    border: 1px solid #dfe3ee;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select { min-width: 130px; }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost.active { border-color: var(--red); color: var(--red); background: #fef0f0; }
  .badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 5px;
    background: var(--red);
    color: #fff;
    border-radius: 999px;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }
  .stats { margin-left: auto; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .stats b { color: var(--green); }
  .stats b.red { color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 8px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-wrap { width: 100%; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e4e8f4; border-radius: 3px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c9bff); border-radius: 3px; transition: width .25s; }
  .progress-num { font-size: 12px; color: var(--text-sub); white-space: nowrap; }

  .scene { perspective: 1400px; width: 100%; max-width: 560px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(150deg, #ffffff, #f6f8ff); }
  .word {
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700;
    word-break: break-word;
    line-height: 1.2;
  }
  .word.zh { font-size: clamp(26px, 6vw, 42px); color: var(--primary-dark); font-weight: 600; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-sub); }
  .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    color: var(--text-sub);
    background: #eef1fb;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .known-dot {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #e8f7f0;
    color: var(--green);
  }
  .wrong-dot {
    position: absolute;
    top: 40px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #fdebec;
    color: var(--red);
  }
  .pos { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: #b6bccb; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, filter .15s;
  }
  .actions button:active { transform: scale(.97); }
  #btnUnknown { background: var(--red); }
  #btnKnown { background: var(--green); }
  #btnFlip { background: var(--primary); width: 100%; max-width: 560px; flex: none; }
  .actions button[disabled] { opacity: .45; cursor: default; }

  .done-panel { text-align: center; max-width: 480px; }
  .done-panel h2 { font-size: 26px; margin-bottom: 10px; }
  .done-panel p { color: var(--text-sub); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .done-panel button {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #btnAgainUnknown { background: var(--primary); }
  #btnRestart { background: #8a93a8; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c4;
    padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
  }
  kbd {
    background:#fff;border:1px solid #dfe3ee;border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;font-size:11px;color:#5b6272;
  }
  @media (max-width: 480px) {
    .card { min-height: 250px; }
    .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>英语词汇卡 <small>点击卡片 · 看英文想中文</small></h1>
  <div class="toolbar">
    <select id="groupSel"></select>
    <button class="btn-ghost" id="btnShuffle">洗牌</button>
    <button class="btn-ghost" id="btnWrongBook">错题本<span class="badge" id="wrongBadge">0</span></button>
    <button class="btn-ghost" id="btnReset">清空进度</button>
    <span class="stats" id="statsLine"></span>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progressFill"></i></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
  </div>

  <div class="scene" id="study">
    <div class="card" id="card">
      <div class="face front">
        <span class="tag" id="tagFront"></span>
        <span class="known-dot" id="knownDot" hidden>已掌握</span>
        <span class="wrong-dot" id="wrongDot" hidden>错题</span>
        <div class="word" id="wordFront"></div>
        <div class="hint">想一想中文意思，点击卡片查看</div>
        <span class="pos" id="posFront"></span>
      </div>
      <div class="face back">
        <span class="tag" id="tagBack"></span>
        <div class="word zh" id="wordBack"></div>
        <div class="hint" id="enBack"></div>
      </div>
    </div>
  </div>

  <div class="done-panel" id="done" hidden>
    <h2 id="doneTitle">本组完成 🎉</h2>
    <p id="doneText"></p>
    <button id="btnAgainUnknown">只复习未掌握的卡片</button>
    <button id="btnRestart">重新开始本组</button>
  </div>

  <div class="actions" id="actions">
    <button id="btnFlip">翻转卡片（空格）</button>
    <button id="btnUnknown" hidden>不认识 ←</button>
    <button id="btnKnown" hidden>认识 →</button>
  </div>
</main>

<footer>答错自动收录错题本 · 在错题本答对后消除 · 数据保存在本地浏览器</footer>

"group":"Group 43"},{"en":"suspicion","zh":"怀疑","group":"Group 43"},{"en":"sweep","zh":"打扫，席卷","group":"Group 43"},{"en":"switch","zh":"开关，转换","group":"Group 43"},{"en":"symbolic","zh":"象征的","group":"Group 43"},{"en":"talent","zh":"才能","group":"Group 43"},{"en":"teach","zh":"教","group":"Group 43"},{"en":"temperature","zh":"温度","group":"Group 43"},{"en":"temporary","zh":"临时的","group":"Group 43"},{"en":"tension","zh":"紧张","group":"Group 43"},{"en":"terminal","zh":"终点站，末端的","group":"Group 43"},{"en":"thirst","zh":"口渴，渴望","group":"Group 43"},{"en":"thoughtful","zh":"深思的，体贴的","group":"Group 43"},{"en":"threaten","zh":"威胁","group":"Group 43"},{"en":"thrive","zh":"茁壮成长","group":"Group 43"},{"en":"tide","zh":"潮水","group":"Group 43"},{"en":"tidy","zh":"整洁的","group":"Group 43"},{"en":"timber","zh":"木材","group":"Group 43"},{"en":"tired","zh":"疲倦的","group":"Group 43"},{"en":"title","zh":"标题，头衔","group":"Group 43"},{"en":"tone","zh":"语气，音调","group":"Group 43"},{"en":"transformation","zh":"转变","group":"Group 43"},{"en":"triumph","zh":"胜利","group":"Group 43"},{"en":"trouble","zh":"麻烦","group":"Group 43"},{"en":"trust","zh":"信任","group":"Group 43"},{"en":"try","zh":"尝试","group":"Group 44"},{"en":"tutor","zh":"导师，辅导","group":"Group 44"},{"en":"type","zh":"类型，打字","group":"Group 44"},{"en":"typical","zh":"典型的","group":"Group 44"},{"en":"unceasingly","zh":"不断地","group":"Group 44"},{"en":"uncover","zh":"揭露","group":"Group 44"},{"en":"understanding","zh":"理解","group":"Group 44"},{"en":"uneasy","zh":"不安的","group":"Group 44"},{"en":"unique","zh":"独特的","group":"Group 44"},{"en":"universal","zh":"普遍的，通用的","group":"Group 44"},{"en":"unload","zh":"卸载","group":"Group 44"},{"en":"unnatural","zh":"不自然的","group":"Group 44"},{"en":"upright","zh":"直立的，正直的","group":"Group 44"},{"en":"up-to-date","zh":"最新的","group":"Group 44"},{"en":"usage","zh":"使用，用法","group":"Group 44"},{"en":"used","zh":"用过的，习惯于","group":"Group 44"},{"en":"utility","zh":"效用，公用事业","group":"Group 44"},{"en":"valid","zh":"有效的","group":"Group 44"},{"en":"value","zh":"价值","group":"Group 44"},{"en":"vanish","zh":"消失","group":"Group 44"},{"en":"variable","zh":"变量，可变的","group":"Group 44"},{"en":"variety","zh":"多样性","group":"Group 44"},{"en":"victim","zh":"受害者","group":"Group 44"},{"en":"vigorous","zh":"精力充沛的","group":"Group 44"},{"en":"violate","zh":"违反","group":"Group 44"},{"en":"violence","zh":"暴力","group":"Group 44"},{"en":"virtual","zh":"虚拟的，实际上的","group":"Group 44"},{"en":"virtue","zh":"美德","group":"Group 44"},{"en":"volunteer","zh":"志愿者","group":"Group 44"},{"en":"vote","zh":"投票","group":"Group 44"},{"en":"wage","zh":"工资","group":"Group 44"},{"en":"wait","zh":"等待","group":"Group 44"},{"en":"wander","zh":"漫步","group":"Group 44"},{"en":"whereas","zh":"然而","group":"Group 44"},{"en":"wire","zh":"电线","group":"Group 44"},{"en":"wit","zh":"智慧","group":"Group 44"},{"en":"within","zh":"在...之内","group":"Group 44"},{"en":"wreck","zh":"失事，破坏","group":"Group 44"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const KNOWN_KEY = 'vc_known';
const WRONG_KEY = 'vc_wrong';
const store = {
  get known() { try { return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || '[]')); } catch { return new Set(); } },
  set known(set) { localStorage.setItem(KNOWN_KEY, JSON.stringify([...set])); },
  get wrong() { try { return new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]')); } catch { return new Set(); } },
  set wrong(set) { localStorage.setItem(WRONG_KEY, JSON.stringify([...set])); }
};

let known = store.known;
let wrong = store.wrong;
let mode = 'study';        // 'study' 正常学习 | 'wrong' 错题本
let queue = [];            // array of data indices
let cur = 0;               // pointer into queue
let flipped = false;
let filtered = DATA.map((_, i) => i); // current group filter

// ---------- group select ----------
const groupSel = $('groupSel');
const groups = [...new Set(DATA.map(d => d.group))];
groupSel.innerHTML = '<option value="">全部（' + DATA.length + '）</option>' +
  groups.map(g => {
    const n = DATA.filter(d => d.group === g).length;
    return `<option value="${g}">${g}（${n}）</option>`;
  }).join('');
groupSel.onchange = () => {
  filtered = DATA.map((d, i) => ({ d, i })).filter(x => !groupSel.value || x.d.group === groupSel.value).map(x => x.i);
  buildQueue();
};

// ---------- header stats / mode ----------
function updateHeader() {
  $('btnWrongBook').classList.toggle('active', mode === 'wrong');
  $('btnWrongBook').innerHTML = mode === 'wrong'
    ? '返回学习'
    : '错题本<span class="badge">' + wrong.size + '</span>';
  $('statsLine').innerHTML = mode === 'wrong'
    ? '错题待消除 <b class="red">' + wrong.size + '</b>'
    : '已掌握 <b>' + known.size + '</b> / <span>' + DATA.length + '</span>';
}

// ---------- queue ----------
function buildQueue() {
  let list = filtered.slice();
  if (mode === 'wrong') list = list.filter(i => wrong.has(DATA[i].en));
  queue = list;
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  updateHeader();
  render();
}
function restartGroup() { buildQueue(); }
function reviewUnknown() {
  queue = filtered.filter(i => !known.has(DATA[i].en));
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  render();
}

// ---------- render ----------
function render() {
  if (queue.length === 0 || cur >= queue.length) { renderDone(); return; }
  const d = DATA[queue[cur]];
  $('wordFront').textContent = d.en;
  $('tagFront').textContent = d.group;
  $('knownDot').hidden = mode === 'wrong' || !known.has(d.en);
  $('wrongDot').hidden = !wrong.has(d.en);
  $('posFront').textContent = `${cur + 1} / ${queue.length}`;
  $('wordBack').textContent = d.zh;
  $('tagBack').textContent = d.group;
  $('enBack').textContent = d.en;
  flipped = false;
  $('card').classList.remove('flipped');
  $('btnFlip').hidden = false;
  $('btnFlip').disabled = false;
  $('btnUnknown').hidden = true;
  $('btnKnown').hidden = true;
  $('btnKnown').textContent = mode === 'wrong' ? '答对了 →' : '认识 →';
  $('btnUnknown').textContent = mode === 'wrong' ? '还没记住 ←' : '不认识 ←';
  $('progressFill').style.width = (cur / queue.length * 100) + '%';
  $('progressNum').textContent = `${cur} / ${queue.length}`;
  updateHeader();
}

function renderDone() {
  $('study').style.display = 'none';
  $('done').hidden = false;
  $('actions').style.visibility = 'hidden';
  if (mode === 'wrong') {
    const wrongInFilter = filtered.filter(i => wrong.has(DATA[i].en)).length;
    $('doneTitle').textContent = wrongInFilter === 0 ? '错题全部消除 🎉' : '本轮错题过完 🎉';
    $('doneText').textContent = wrongInFilter === 0
      ? '当前范围的错题都已重新答对。' + (wrong.size === 0 ? '错题本已清空，继续保持！' : '其他分组还有错题，可切换分组继续。')
      : `还有 ${wrongInFilter} 张错题未消除，再练一遍直到全部答对。`;
    $('btnAgainUnknown').hidden = true;
    $('btnRestart').textContent = wrongInFilter === 0 ? '返回学习' : '再练一遍错题';
  } else {
    const unknownInFilter = filtered.filter(i => !known.has(DATA[i].en)).length;
    $('doneTitle').textContent = '本组完成 🎉';
    $('doneText').textContent = unknownInFilter === 0
      ? '太棒了！当前范围的卡片全部掌握。'
      : `本组完成，当前范围还有 ${unknownInFilter} 张未掌握。`;
    $('btnAgainUnknown').hidden = unknownInFilter === 0;
    $('btnRestart').textContent = '重新开始本组';
  }
  $('progressFill').style.width = '100%';
  $('progressNum').textContent = `${queue.length} / ${queue.length}`;
  updateHeader();
}

// ---------- interactions ----------
function flip() {
  if ($('done').hidden === false) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('btnFlip').hidden = flipped;
  $('btnUnknown').hidden = !flipped;
  $('btnKnown').hidden = !flipped;
}
function afterAnswer() {
  flipped = false;
  updateHeader();
  render();
  $('actions').style.visibility = '';
}
$('card').onclick = flip;
$('btnFlip').onclick = flip;
// 正常模式：认识=加入已掌握；错题本：答对=从错题本消除
$('btnKnown').onclick = () => {
  const d = DATA[queue[cur]];
  if (mode === 'wrong') {
    wrong.delete(d.en);
    store.wrong = wrong;
    queue.splice(cur, 1);          // 不前进，下一张移到当前位置
  } else {
    known.add(d.en);
    store.known = known;
    cur++;
  }
  afterAnswer();
};
// 任何模式下不认识都收录错题本，并排到队尾再出现
$('btnUnknown').onclick = () => {
  const d = DATA[queue[cur]];
  wrong.add(d.en);
  store.wrong = wrong;
  queue.push(queue[cur]);
  if (mode === 'wrong') queue.splice(cur, 1);
  else cur++;
  afterAnswer();
};
$('btnShuffle').onclick = () => {
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  cur = 0; render();
};
$('btnReset').onclick = () => {
  if (!confirm('确定清空所有已掌握记录？（错题本不受影响，需在错题本内答对消除）')) return;
  known = new Set(); store.known = known;
  buildQueue();
};
$('btnWrongBook').onclick = () => {
  mode = mode === 'study' ? 'wrong' : 'study';
  buildQueue();
};
$('btnAgainUnknown').onclick = () => { $('actions').style.visibility = ''; reviewUnknown(); };
$('btnRestart').onclick = () => {
  $('actions').style.visibility = '';
  if (mode === 'wrong') buildQueue(); else restartGroup();
};

document.onkeydown = e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' && !$('btnKnown').hidden) $('btnKnown').click();
  else if (e.code === 'ArrowLeft' && !$('btnUnknown').hidden) $('btnUnknown').click();
};

buildQueue();
</script>
